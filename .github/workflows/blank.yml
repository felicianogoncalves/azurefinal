name: Build and Push Docker Image to ACR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Build da imagem
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          VERSAO=$(echo $GITHUB_SHA | cut -c1-7)
          echo criação da imagem "felicianocr.azurecr.io/appbraga:$VERSAO"
          docker build -t "felicianocr.azurecr.io/appbraga:$VERSAO" .
          echo fazer o login no azure
          ${{ secrets.DOCKERLOGIN }}
          echo Envio da imagem para azure
          docker push "felicianocr.azurecr.io/appbraga:$VERSAO"
